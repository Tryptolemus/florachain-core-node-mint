<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloraChain — Core Node Sale</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
:root{--bg:#050505;--lime:#ccff00;--muted:#8a8a8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f2f2;font-family:system-ui,sans-serif}.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid #1a1a1a}.brand{display:flex;align-items:center;gap:.75rem;color:#fff;text-decoration:none}.logo-eclipse{position:relative;width:2.25rem;height:2.25rem;display:flex;align-items:center;justify-content:center}.logo-glow{position:absolute;inset:0;background:rgba(204,255,0,.4);filter:blur(12px);border-radius:999px}.logo-core{position:relative;width:2rem;height:2rem;background:#000;border-radius:999px;box-shadow:0 -3px 12px rgba(204,255,0,.6);overflow:hidden}.logo-rim{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:1.5rem;height:4px;background:#ccff00;filter:blur(2px);border-radius:999px;box-shadow:0 0 10px #ccff00}.logo-rim-sharp{position:absolute;inset:0;border-radius:999px;border-top:1.5px solid #ccff00}.logo-inner{position:absolute;top:0;left:50%;transform:translateX(-50%);width:1.25rem;height:1.25rem;background:radial-gradient(circle at top,#ccff00 0%,transparent 70%);opacity:.3}.brand-text{font-weight:600}.brand-muted{color:#6b7280}.pill{background:var(--lime);color:#000;padding:.55rem .95rem;border-radius:999px;text-decoration:none}.hero{max-width:1120px;margin:auto;padding:3.5rem 1.5rem;display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center}h1{font-size:clamp(2.4rem,5vw,3.6rem)}em{font-style:normal;color:var(--lime)}.lede{color:var(--muted);line-height:1.6}.panel{border:1px solid #1f1f1f;background:#080808;border-radius:20px;padding:1.25rem}.art-wrap{border-radius:16px;overflow:hidden;border:1px solid #222;background:#000}.art-wrap img{display:block;width:100%;height:auto}.primary{width:100%;padding:1rem;background:var(--lime);border:0;border-radius:12px;cursor:pointer}@media(max-width:900px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="https://www.florachain.xyz"><div class="logo-eclipse" aria-hidden="true"><div class="logo-glow"></div><div class="logo-core"><div class="logo-rim"></div><div class="logo-rim-sharp"></div><div class="logo-inner"></div></div></div><span class="brand-text">FLORA<span class="brand-muted">CHAIN</span></span></a><a class="pill" href="#mint">Mint Core Node</a></header>
<main class="hero"><section><p style="color:var(--lime)">LICENSED CORE NODES · PUBLIC SALE</p><h1>Run the core.<br>Own a <em>FloraChain</em> node.</h1><p class="lede">Mint a soulbound FloraChain Core Node (FCORE) on Ethereum for exactly <strong>399 USDC</strong>.</p></section><section class="panel" id="mint"><div class="art-wrap"><img id="nftArt" alt="FloraChain Core Node NFT" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////2wBDAf//////////////////////////////////////////////////////////////////////////////////////wAARCAABAAEDASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAX/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIQAxAAAAH/AP/EABQQAQAAAAAAAAAAAAAAAAAAACD/2gAIAQEAAQUCf//EABQRAQAAAAAAAAAAAAAAAAAAACD/2gAIAQMBAT8BP//EABQRAQAAAAAAAAAAAAAAAAAAACD/2gAIAQIBAT8BP//EABQQAQAAAAAAAAAAAAAAAAAAACD/2gAIAQEAAT8hf//Z"></div><p>UNIT PRICE</p><h2 style="color:var(--lime)">399 USDC</h2><button class="primary" type="button">Connect wallet</button></section></main>
<script>const art=document.getElementById('nftArt');if(!art.src.includes('data:image/jpeg;base64'))art.src='data:image/jpeg;base64,/9j/';</script>
</body></html>
