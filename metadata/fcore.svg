<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="FloraChain Core Node">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1f14"/>
      <stop offset="55%" stop-color="#123d28"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="100%" stop-color="#1FAE6A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3DFF9A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3DFF9A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="460" r="280" fill="url(#glow)"/>
  <!-- hex node frame -->
  <polygon points="512,220 690,320 690,520 512,620 334,520 334,320" fill="none" stroke="#2ECC71" stroke-width="6" opacity="0.9"/>
  <polygon points="512,260 660,345 660,495 512,580 364,495 364,345" fill="#0f2a1c" stroke="#7CFFB2" stroke-width="3" opacity="0.95"/>
  <!-- center leaf / flora mark -->
  <g transform="translate(512 430)">
    <ellipse cx="0" cy="-10" rx="55" ry="90" fill="url(#leaf)" transform="rotate(-25)"/>
    <ellipse cx="0" cy="-10" rx="55" ry="90" fill="url(#leaf)" transform="rotate(25)" opacity="0.85"/>
    <path d="M0 70 L0 -80" stroke="#0a1f14" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- connection nodes -->
  <circle cx="512" cy="220" r="14" fill="#7CFFB2" filter="url(#soft)"/>
  <circle cx="690" cy="320" r="10" fill="#2ECC71"/>
  <circle cx="690" cy="520" r="10" fill="#2ECC71"/>
  <circle cx="512" cy="620" r="14" fill="#7CFFB2"/>
  <circle cx="334" cy="520" r="10" fill="#2ECC71"/>
  <circle cx="334" cy="320" r="10" fill="#2ECC71"/>
  <text x="512" y="760" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#E8FFF2">FloraChain Core Node</text>
  <text x="512" y="815" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" fill="#7CFFB2" letter-spacing="4">FCORE</text>
  <text x="512" y="880" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#8FB9A3">metaflora.xyz · florachain.xyz</text>
</svg>
